name: CI/CD Pipeline — INOXYA BIJOUX

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ─── Job 1: Code Quality ───────────────────────────────────────────────────
  quality:
    name: 🔍 TypeScript + Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev
        env:
          CI: 'true'
          SKIP_POSTINSTALL: '1'

      - name: Patch ESLint/minimatch (v10 compat)
        run: node scripts/patch-eslint-minimatch.js

      - name: Verify TypeScript (fail fast)
        run: node -e "require('typescript'); console.log('ts ok')"

      - name: List deps (diagnostic)
        run: npm ls autoprefixer postcss pg typescript || true

      - name: TypeScript check (project tsconfig)
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ─── Job 2: Unit Tests ────────────────────────────────────────────────────
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --include=dev
        env:
          CI: 'true'
          SKIP_POSTINSTALL: '1'
      # Tests sans coverage pour éviter échec CI (vitest/coverage-v8 incompatible Node 20)
      - name: Run unit tests
        run: npm run test -- --run

  # ─── Job 3: Build ─────────────────────────────────────────────────────────
  # Définir les 5 secrets dans GitHub → Settings → Secrets and variables → Actions
  # NODE_ENV=production uniquement au step build (pas à l'install) pour que npm ci installe devDependencies (postcss/autoprefixer/tailwind/etc.)
  build:
    name: 🏗️ Production Build
    runs-on: ubuntu-latest
    needs: test
    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci-build-secret-minimum-32-chars-xyz-12345' }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://inoxya-bijoux.vercel.app' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || '' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || '' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: |
          echo "Running: npm ci --include=dev (must include autoprefixer + pg)"
          npm ci --include=dev
        env:
          CI: 'true'
          SKIP_POSTINSTALL: '1'
      - name: Fail-fast deps
        run: node -e "require('postcss'); require('autoprefixer'); require('pg'); console.log('deps ok')"
      - name: Diagnostics (env + npm config + deps)
        run: |
          node -v && npm -v
          npm config get omit || true
          npm config get production || true
          npm ls autoprefixer postcss pg --all || true
      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production
      - name: Verify build output
        run: ls -la .next/

  # ─── Job 4: Security Audit ────────────────────────────────────────────────
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --include=dev
        env:
          CI: 'true'
          SKIP_POSTINSTALL: '1'
      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true  # Don't block on moderate vulnerabilities
