version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inoxya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inoxya_bijoux
      POSTGRES_USER: inoxya_user
      POSTGRES_PASSWORD: inoxya_password_2024
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d
    networks:
      - inoxya-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inoxya-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inoxya.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - inoxya-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  inoxya-network:
    driver: bridge
